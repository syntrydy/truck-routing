[project]
name = "truck-routing-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2,<7",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "hypothesis>=6.170.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "--cov=planner --cov=config --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
omit = ["config/wsgi.py", "config/settings_test.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "S", "SIM", "RET",
    "PL", "PT", "N", "C4", "DTZ", "ERA",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"conftest.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["planner.domain", "planner.domain.*", "planner.providers", "planner.providers.*"]
strict = true

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
