[project]
name = "truck-routing-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "hypothesis>=6.170.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
