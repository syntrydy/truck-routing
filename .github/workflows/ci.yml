name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: "3.12"
      # Placeholder so settings load without a .env file; not a real secret.
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Tests with coverage gate
        run: uv run pytest --cov-fail-under=85
      - name: OpenAPI schema file is up to date
        run: |
          uv run python manage.py spectacular --format openapi-json --file openapi/schema.json
          git diff --exit-code -- openapi/schema.json
      - name: Static security analysis
        run: uv run bandit -q -r config planner -c pyproject.toml
      - name: Dependency audit
        run: uv run pip-audit
      - name: Deployment checks
        env:
          DEBUG: "false"
          ALLOWED_HOSTS: api.example.com
          TRUST_PROXY_SSL_HEADER: "true"
        run: |
          SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
