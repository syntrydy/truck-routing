version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # ESLint 10 is not supported yet by eslint-plugin-jsx-a11y (peer range stops at 9).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint requires TypeScript below 6.1, so TypeScript 7 cannot be linted yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # jsdom 30 needs Node 22.22.2 or newer; the tests must keep running on Node 20 and early 22.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
