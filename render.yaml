# Render Blueprint for the API (SPEC section 2). The web app is deployed on Vercel.
services:
  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync gunicorn config.wsgi -c config/gunicorn.conf.py
    # Liveness only: it does not call the upstream services, so an outage there never restarts us.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: truck-routing-api-dw0w.onrender.com
      # Set both to the exact Vercel origin (https://<project>.vercel.app) after the first deploy.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Render terminates TLS and adds one hop to X-Forwarded-For.
      - key: TRUST_PROXY_SSL_HEADER
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Optional routing fallback behind OSRM; leave empty to run without it.
      - key: ORS_API_KEY
        sync: false
      # The free plan has 512 MB; the plan service waits on the network, so threads do the work.
      - key: WEB_CONCURRENCY
        value: "1"
