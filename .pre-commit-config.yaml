# Install once with: pre-commit install
# Tools pinned by the project (ruff, mypy, prettier, eslint) run as local hooks so
# they always match uv.lock and package-lock.json.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: bash -c 'cd backend && uv run ruff check .'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        language: system
        entry: bash -c 'cd backend && uv run ruff format --check .'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        language: system
        entry: bash -c 'cd backend && SECRET_KEY="${SECRET_KEY:-pre-commit-placeholder}" uv run mypy .'
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: prettier
        name: prettier
        language: system
        entry: npm --prefix frontend run --silent format:check
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint
        language: system
        entry: npm --prefix frontend run --silent lint
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
